{{ define "main" }}
<article class="max-w-none">
	<header class="mb-10 text-center border-b border-border-subtle pb-10">
		<h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-text-primary mb-6 leading-tight">
			{{ .Title }}
		</h1>
	</header>

	<div class="prose prose-lg mx-auto max-w-none">
		{{ .Content }}
	</div>

	<section class="mt-16">
		<h2 class="text-3xl font-bold mb-8">Recent Posts</h2>
		<ul class="space-y-12 list-none pl-0">
			{{ range first 5 (where .Site.RegularPages "Section" "posts").ByPublishDate.Reverse }}
			{{ partial "listitem.html" . }}
			{{ end }}
		</ul>
	</section>
</article>
{{ end }}
