<li class="group">
	<a href="{{ .RelPermalink }}" class="block">
		<div class="flex items-center text-sm mb-3 space-x-4">
			<h3 class="text-2xl font-bold text-red transition-colors mb-2">
				{{ .Title }}
			</h3>
			{{ if .PublishDate }}
			<time datetime="{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" }}">{{ time.Format "January 2, 2006" .PublishDate }}</time>
			{{ end }}
		</div>
	</a>
</li>
