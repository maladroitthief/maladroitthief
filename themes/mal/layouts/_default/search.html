{{ define "main" }}
<article class="max-w-none" data-pagefind-ignore>
	<header class="mb-10 text-center border-b pb-10">
		<h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-6 leading-tight">
			{{ .Title }}
		</h1>
	</header>

	<div id="search-info" class="text-sm italic mb-6 min-h-[1.5em]"></div>
	<div id="search-results" class="space-y-10"></div>
	<div id="pagination" class="mt-16 flex justify-center items-center gap-8"></div>
	
	<script type="module">
		async function initSearch() {
			const pagefind = await import("/pagefind/pagefind.js");
			await pagefind.init();

			const headerInput = document.getElementById('header-search');
			const resultsArea = document.getElementById('search-results');
			const infoArea = document.getElementById('search-info');
			const paginationArea = document.getElementById('pagination');

			const RESULTS_PER_PAGE = 10;
			let currentResults = [];
			let currentPage = 0;
			let currentQuery = "";

			async function renderPage(page) {
				currentPage = page;
				const start = page * RESULTS_PER_PAGE;
				const end = start + RESULTS_PER_PAGE;
				const pageResults = currentResults.slice(start, end);

				// Show loading state or clear area
				resultsArea.innerHTML = '<div class="animate-pulse space-y-8">' + 
					Array(3).fill('<div class="h-24 bg-hover-bg rounded-md"></div>').join('') + 
					'</div>';

				const data = await Promise.all(pageResults.map(r => r.data()));

				resultsArea.innerHTML = data.map(result => `
					<div class="search-result group">
						<h3 class="text-2xl font-bold mb-2">
							<a href="${result.url}" class="hover:underline decoration-2 underline-offset-4">
								${result.meta.title || 'Untitled'}
							</a>
						</h3>
						<p class="leading-relaxed">${result.excerpt}</p>
						<div class="mt-2 text-xs font-mono opacity-60 uppercase tracking-widest">
							${result.url}
						</div>
					</div>
				`).join('');

				renderPagination();
				window.scrollTo({ top: 0, behavior: 'smooth' });
			}

			function renderPagination() {
				const totalPages = Math.ceil(currentResults.length / RESULTS_PER_PAGE);
				if (totalPages <= 1) {
					paginationArea.innerHTML = '';
					return;
				}

				paginationArea.innerHTML = `
					<button id="prev-page" ${currentPage === 0 ? 'disabled' : ''} class="pagination-btn">
						&larr; Previous
					</button>
					<span class="text-sm font-medium">Page ${currentPage + 1} of ${totalPages}</span>
					<button id="next-page" ${currentPage === totalPages - 1 ? 'disabled' : ''} class="pagination-btn">
						Next &rarr;
					</button>
				`;

				document.getElementById('prev-page')?.addEventListener('click', () => renderPage(currentPage - 1));
				document.getElementById('next-page')?.addEventListener('click', () => renderPage(currentPage + 1));
			}

			async function doSearch(query) {
				currentQuery = query;
				if (!query) {
					resultsArea.innerHTML = '';
					infoArea.innerHTML = '';
					paginationArea.innerHTML = '';
					return;
				}

				const search = await pagefind.search(query);
				currentResults = search.results;

				if (currentResults.length === 0) {
					resultsArea.innerHTML = `<p class="italic text-lg">No results found for "${query}"</p>`;
					infoArea.innerHTML = '';
					paginationArea.innerHTML = '';
					return;
				}

				infoArea.innerHTML = `Found ${currentResults.length} result${currentResults.length === 1 ? '' : 's'} for "${query}"`;
				renderPage(0);
			}

			if (headerInput) {
				headerInput.addEventListener('input', (e) => {
					doSearch(e.target.value);
				});

				if (headerInput.value) {
					doSearch(headerInput.value);
				}
			}
		}

		window.addEventListener('DOMContentLoaded', initSearch);
	</script>

	<style>
		.search-result {
			padding-bottom: 2.5rem;
			border-bottom: 1px solid var(--border-subtle);
		}
		.search-result:last-child {
			border-bottom: none;
		}
		/* Highlight pagefind matches */
		mark {
			background-color: var(--color-hover-bg);
			color: var(--color-text-accent);
			font-weight: 600;
			padding: 0 0.1em;
			border-radius: 2px;
		}
		.pagination-btn {
			padding: 0.5rem 1rem;
			border: 1px solid var(--border-subtle);
			border-radius: 0.375rem;
			font-size: 0.875rem;
			font-weight: 500;
			transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
			transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
			transition-duration: 150ms;
			cursor: pointer;
		}
		.pagination-btn:hover:not(:disabled) {
			background-color: var(--hover-bg);
		}
		.pagination-btn:disabled {
			opacity: 0.3;
			cursor: not-allowed;
		}
	</style>
</article>
{{ end }}
