{{ define "main" }}
<article class="max-w-none">
	<header class="mb-10 text-center border-b border-border-subtle pb-10">
		{{ if eq .Section "posts" }}
		<div class="text-sm text-text-secondary mb-3 font-medium tracking-wide uppercase">
			{{ time.Format "January 2, 2006" .PublishDate }}
		</div>
		{{ end }}
		<h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-text-primary mb-6 leading-tight">{{ .Title }}</h1>
		{{ if .Params.Tags }}
		<div class="flex justify-center gap-2">
			{{ range .Params.Tags }}
			<a href="/tags/{{ . | urlize }}" class="bg-hover-bg hover:bg-border-subtle text-text-secondary px-3 py-1 rounded-full text-xs font-semibold transition-colors">
				{{ . }}
			</a>
			{{ end }}
		</div>
		{{ end }}
	</header>
	
	<div class="prose prose-lg mx-auto max-w-none">
		{{ .Content }}
	</div>
</article>
{{ end }}
